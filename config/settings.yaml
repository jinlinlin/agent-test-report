# 测试报告生成 Agent V1.0 运行配置
# 说明：V1 默认用 mock 数据源离线跑通链路，接真实禅道时把 zentao.mode 改为 live 并配置 .env

llm:
  # DeepSeek（OpenAI 兼容协议）；换回 OpenAI 时改 base_url 和 model 即可
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  temperature: 0.0
  max_tokens: 2048
  # 无 OPENAI_API_KEY 时自动回退到确定性规划器（脚本化取数顺序），保证链路可离线跑通
  # 原生 Function Calling 协议开关（true=走 tools 参数+tool_calls 解析，false=确定性规划）
  use_native_fc: true

agent:
  max_steps: 12          # 执行上限；验证 V1-005（步数超限）时调小，例如 3
  clarify_max_times: 1   # 缺版本名时最多澄清次数（V1-007）

zentao:
  # 真实禅道地址请勿写入本文件（会随仓库入版本控制）：
  # 在 config/.env（已 .gitignore）里设 ZENTAO_BASE_URL=http://<内网地址>/zentao，会覆盖下方占位。
  base_url: "http://your-intranet-host/zentao"
  mode: "live"           # mock | live；接真实禅道改为 live
  timeout_seconds: 10
  api_prefix: "/api.php/v1"   # 禅道 RESTful API 前缀
  page_size: 100              # 分页拉取每页条数
  default_product: "UniResearch"  # 输入未能识别到产品时的兜底关键字（多项目靠真实产品名自动匹配）
  # 账号密码换 token（推荐放 .env 的 ZENTAO_ACCOUNT/ZENTAO_PASSWORD，不要写在这里）
  account: ""
  password: ""
  # 字段映射：不同禅道版本字段名可能不同，先用 `python -m report_agent.main --probe` 打印真实字段名再核对调整
  field_product_name: "name"
  field_product_desc: "desc"
  field_module: "module"          # 列表接口返回模块 ID；真实名称逐条从 /bugs/{id} 的 moduleTitle 取
  field_severity: "severity"      # 1=P1 致命, 2=P2 严重, 3=P3 一般, 4=P4 建议
  field_status: "status"          # active | resolved | closed
  field_resolution: "resolution"  # fixed | postponed | willnotfix | notrepro | duplicate | bydesign | external
  field_activated: "activatedCount"
  field_build: "openedBuild"      # 影响版本：禅道把“版本”建模为缺陷的 openedBuild（如 V5.0.0，可逗号多版本）
  field_opened_date: "openedDate" # 缺陷创建时间（ISO8601 UTC）；测试起止时间由本版本缺陷该字段的 min/max 实算
  field_opened_by: "openedBy"     # 缺陷提交人（账号）：测试负责人/测试人员由本版本缺陷 openedBy 去重聚合
  field_resolved_by: "resolvedBy" # 缺陷解决人（账号）：软件工程师（开发/运维）由本版本缺陷 resolvedBy 去重聚合
  field_product_owner: "PO"       # 项目负责人：产品列表“负责人”列对应产品对象的 PO 字段（如 UniResearch→黄运）；若 --probe 显示 PO 是账号而非姓名，需再引 /users 映射
  # 缺陷清单（第 6 节）展示字段（仅用于明细表呈现，不影响统计口径；列表接口缺的字段从单条详情补拉）
  field_title: "title"            # bug 标题
  field_priority: "pri"           # 优先级（禅道键名为 pri，非 priority）
  field_type: "type"              # 功能类型（缺陷类型）
  field_steps: "steps"            # 重现步骤（禅道为 HTML，渲染去标签+截断）
  field_assigned_to: "assignedTo" # 指派给
  # 测试起止时间：默认由缺陷创建时间实算（见上）；下方仅当缺陷无可用日期时作兜底或手工覆盖
  test_start: ""
  test_end: ""

feishu:
  # V2 技术验证：报告导入为飞书云文档并写入知识库。默认关闭，用 --push-feishu 临时开启。
  # 凭据与各 token 一律放 config/.env（FEISHU_APP_ID/SECRET/FOLDER_TOKEN/WIKI_SPACE_ID/WIKI_PARENT_NODE），勿写这里。
  enabled: false
  api_base: "https://open.feishu.cn/open-apis"
  doc_base_url: "https://feishu.cn"   # 个人版租户改为 https://my.feishu.cn
  target: "wiki"                      # wiki=导入后移动到知识库节点；drive=仅导入到云空间文件夹
  # 多项目落点：wiki_projects_parent=各项目子节点的容器（如“项目测试”），推送时按产品名在其下找同名子节点；
  # wiki_parent_node=兜底默认落点（未匹配到子节点时用）。两者 node_token 均放 .env。
  import_poll_seconds: 30
  # 导入格式：true=先用本地 pandoc 把报告 md 转成内嵌图表的 docx 再导入（飞书才不丢图，需装 pandoc）；
  # pandoc 缺失或转换失败会自动回退直接导 md（图丢失但不阻断）。false=始终直接导 md。
  import_as_docx: true
  # 仅放大图片在飞书文档中的显示尺寸（等比倍率，只改图，不改页面/正文）：1.0=不放大；
  # 上限受飞书正文列宽约束（现约 5.83in），1.6 约可接近翻倍但仍可能被飞书自适应截断。
  chart_display_scale: 1.4
  # 第 6 节缺陷清单：true=开启飞书时将延期/激活两类缺陷以多维表格呈现（重现步骤全文不截断）；未启用/无缺陷则自动回退为正文宽表。
  defect_bitable: true
  # 多维表格形态：true=以“文档内嵌块”直接展开在报告正文（C，需 docx:document + base:field/record/table 增删改并发布）；
  # false=降级为正文内嵌宽表（不再创建独立多维表格知识库节点）。内嵌失败时自动降级为仅计数说明，不阻断报告。
  defect_bitable_embed: true

mock:
  # F6 故障注入开关：none | not_found | timeout | error | empty_bugs
  fault: "none"

trace:
  enabled: true
  dir: "traces"

report:
  output_dir: "output"
  # F17 结论段 LLM 润色：开启后 5.1 发布建议由模型组织语言（数字必须与统计结果一致，不一致自动回退模板原文）；默认关
  polish_conclusion: false

charts:
  # matplotlib 本地生成图表（状态条形柱状图/激活次数与每人提交解决水平柱状图/等级饼图；4.1.1 模块分布仅表格不出图）到 output/assets/<版本>/，
  # 报告内以相对路径引用；单图失败或 enabled: false 时回退【图表占位】文字，不阻断报告。
  enabled: true
  dpi: 150
