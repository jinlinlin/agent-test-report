# 测试报告生成 Agent V1.0 运行配置
# 说明：V1 默认用 mock 数据源离线跑通链路，接真实禅道时把 zentao.mode 改为 live 并配置 .env

llm:
  # DeepSeek（OpenAI 兼容协议）；换回 OpenAI 时改 base_url 和 model 即可
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  temperature: 0.0
  max_tokens: 2048
  # 无 OPENAI_API_KEY 时自动回退到确定性规划器（脚本化取数顺序），保证链路可离线跑通
  # 原生 Function Calling 协议开关（true=走 tools 参数+tool_calls 解析，false=确定性规划）
  use_native_fc: true

agent:
  max_steps: 12          # 执行上限；验证 V1-005（步数超限）时调小，例如 3
  clarify_max_times: 1   # 缺版本名时最多澄清次数（V1-007）
  interactive_clarify: false   # V2-1：模糊输入交互澄清回合；关时行为与 V1 逐字一致
  llm_intent_fallback: false   # V2-1 延伸：规则未命中时 LLM 仅在候选集内翻译意图；关时不产生任何额外 LLM 调用

zentao:
  # 真实禅道地址请勿写入本文件（会随仓库入版本控制）：
  # 在 config/.env（已 .gitignore）里设 ZENTAO_BASE_URL=http://<内网地址>/zentao，会覆盖下方占位。
  base_url: "http://your-intranet-host/zentao"
  mode: "live"           # mock | live；接真实禅道改为 live
  timeout_seconds: 10
  api_prefix: "/api.php/v1"   # 禅道 RESTful API 前缀
  page_size: 100              # 分页拉取每页条数
  default_product: "UniResearch"  # 输入未能识别到产品时的兜底关键字（多项目靠真实产品名自动匹配）
  # 账号密码换 token（推荐放 .env 的 ZENTAO_ACCOUNT/ZENTAO_PASSWORD，不要写在这里）
  account: ""
  password: ""
  # 字段映射：不同禅道版本字段名可能不同，先用 `python -m report_agent.main --probe` 打印真实字段名再核对调整
  field_product_name: "name"
  field_product_desc: "desc"
  field_module: "module"          # 列表接口返回模块 ID；真实名称逐条从 /bugs/{id} 的 moduleTitle 取
  field_severity: "severity"      # 1=P1 致命, 2=P2 严重, 3=P3 一般, 4=P4 建议
  field_status: "status"          # active | resolved | closed
  field_resolution: "resolution"  # fixed | postponed | willnotfix | notrepro | duplicate | bydesign | external
  field_activated: "activatedCount"
  field_build: "openedBuild"      # 影响版本：禅道把“版本”建模为缺陷的 openedBuild（如 V5.0.0，可逗号多版本）
  field_opened_date: "openedDate" # 缺陷创建时间（ISO8601 UTC）；测试起止时间由本版本缺陷该字段的 min/max 实算
  field_closed_date: "closedDate" # 缺陷关闭时间（V2-6 关闭事件归属；列表接口缺失时从单条详情补拉，可 --probe 核实）
  field_opened_by: "openedBy"     # 缺陷提交人（账号）：测试负责人/测试人员由本版本缺陷 openedBy 去重聚合
  field_resolved_by: "resolvedBy" # 缺陷解决人（账号）：软件工程师（开发/运维）由本版本缺陷 resolvedBy 去重聚合
  field_product_owner: "PO"       # 项目负责人：产品对象 PO 字段；probe 已核实（2026-11-12）PO 为 {id,account,realname} 嵌套对象，渲染层取 realname 姓名，无需 /users 映射
  # 缺陷清单（第 6 节）展示字段（仅用于明细表呈现，不影响统计口径；列表接口缺的字段从单条详情补拉）
  field_title: "title"            # bug 标题
  field_priority: "pri"           # 优先级（禅道键名为 pri，非 priority）
  field_type: "type"              # 功能类型（缺陷类型）
  field_steps: "steps"            # 重现步骤（禅道为 HTML，渲染去标签+截断）
  field_assigned_to: "assignedTo" # 指派给
  # 测试起止时间：默认由缺陷创建时间实算（见上）；下方仅当缺陷无可用日期时作兜底或手工覆盖
  test_start: ""
  test_end: ""

feishu:
  # V2 技术验证：报告导入为飞书云文档并写入知识库。默认关闭，用 --push-feishu 临时开启。
  # 凭据与各 token 一律放 config/.env（FEISHU_APP_ID/SECRET/FOLDER_TOKEN/WIKI_SPACE_ID/WIKI_PARENT_NODE），勿写这里。
  enabled: false
  api_base: "https://open.feishu.cn/open-apis"
  doc_base_url: "https://feishu.cn"   # 个人版租户改为 https://my.feishu.cn
  target: "wiki"                      # wiki=导入后移动到知识库节点；drive=仅导入到云空间文件夹
  # 多项目落点：wiki_projects_parent=各项目子节点的容器（如“项目测试”），推送时按产品名在其下找同名子节点；
  # wiki_parent_node=兜底默认落点（未匹配到子节点时用）。两者 node_token 均放 .env。
  import_poll_seconds: 30
  # 导入格式：true=先用本地 pandoc 把报告 md 转成内嵌图表的 docx 再导入（飞书才不丢图，需装 pandoc）；
  # pandoc 缺失或转换失败会自动回退直接导 md（图丢失但不阻断）。false=始终直接导 md。
  import_as_docx: true
  # 仅放大图片在飞书文档中的显示尺寸（等比倍率，只改图，不改页面/正文）：1.0=不放大；
  # 上限受飞书正文列宽约束（现约 5.83in），1.6 约可接近翻倍但仍可能被飞书自适应截断。
  chart_display_scale: 1.4
  # 导入后把正文各表格首行标记为飞书内置标题行（整格底色）。飞书 docx API 无格级背景色（实测），
  # 颜色为飞书内置不可单独指定；false=关闭，不多发一次网络调用。失败非致命不阻断推送。
  table_header_row: true
  # 导入后按版式补打正文表格列宽（docx 导入会把 column_width 重置为等宽，实测；按表头文字匹配版式，未命中的表不动）。
  # false=关闭：不多发一次网络调用。失败非致命不阻断推送。
  table_column_widths: true
  # 第 6 节缺陷清单：true=开启飞书时将延期/激活两类缺陷以多维表格呈现（重现步骤全文不截断）；未启用/无缺陷则自动回退为正文宽表。
  defect_bitable: true
  # 多维表格形态：true=以“文档内嵌块”直接展开在报告正文（C，需 docx:document + base:field/record/table 增删改并发布）；
  # false=降级为正文内嵌宽表（不再创建独立多维表格知识库节点）。内嵌失败时自动降级为仅计数说明，不阻断报告。
  defect_bitable_embed: true

bot:
  # 飞书应用机器人入口（长连接收自然语言 → generate_report → 回消息）。默认关：不开就完全不建连接。
  # 启动：python -m report_agent.bot（需先在开发者后台开机器人能力 + 事件订阅 im.message.receive_v1
  # 选长连接 + 申请 im:message 类权限并发版，再把应用加进目标群）。
  enabled: false
  # 机器人产出的报告是否推飞书知识库：true=回 wiki 链接（同事看的就是这个）；false=只回本地路径。
  push: true
  # 同时跑几份报告：1=串行（默认）。并发会放大对禅道的拉取，且同一版本可能被重复生成。
  max_workers: 1
  # 白名单一律走 .env：FEISHU_BOT_ALLOWED_CHATS（群 chat_id，逗号分隔）/ FEISHU_BOT_ALLOWED_USERS（open_id）。
  # 两项全空 = 全部拒绝（启动会直接退出提醒），不要为了跑通而先置成放行。

mock:
  # F6 故障注入开关：none | not_found | timeout | error | empty_bugs
  fault: "none"

trace:
  enabled: true
  dir: "traces"

report:
  output_dir: "output"
  # F17 结论段 LLM 润色：开启后 5.1 发布建议由模型组织语言（数字必须与统计结果一致，不一致自动回退模板原文）；默认关
  polish_conclusion: false
  # V2-7 报告数字自检：渲染完成后再二次核对报告数字∈统计源值，不一致按源值重渲染并在顶部标注；默认关
  numeric_selfcheck: false
  # V2-6 缺陷关闭构成：4.1.2 按版本归属呈现 本版本关闭（= 4.1 已关闭数）＋ 本周期协助关闭的其他版本缺陷，合计为总关闭。
  # 协助关闭不计入缺陷总数、修复覆盖率与发布准入。
  # 代码默认关（关时报告与现状逐字一致）；此处生产配置默认开，改回 false 或 CLI 不加参数即关
  closure_breakdown: true

charts:
  # matplotlib 本地生成图表（状态条形柱状图/激活次数与每人提交解决水平柱状图/等级饼图；4.1.1 模块分布仅表格不出图）到 output/assets/<版本>/，
  # 报告内以相对路径引用；单图失败或 enabled: false 时回退【图表占位】文字，不阻断报告。
  enabled: true
  dpi: 150

memory:
  # V2-3 项目级长期记忆：§1.3 参考文档中手册/UI/原型这类「同一项目每版本都一样」的链接，
  # 首次由用户提供后按项目登记到本地小抄，之后同项目复用（严格按项目隔离，新项目仍首次询问）。
  # 需求文档不属记忆组：与测试大纲/用例同走版本目录检索（templates.REF_DOC_LINK_TITLES）。
  # 默认关：关闭时不读写小抄，§1.3 行为与现状逐字一致。小抄文件走 .gitignore，不入库。
  doc_links_enabled: false
  dir: "memory"
  doc_links_file: "doc_links.json"

scope:
  # V2-4 测试范围接地：从本版本目录下的测试用例表自动提取 2.1 测试范围。
  # 两种载体都支持：上传的 .xlsx 附件（drive 下载）优先，否则读飞书原生电子表格（sheets 取值接口）。
  # 模块=菜单目录（一级），描述=该菜单测到的功能点（二级/用例名）；提不出则整体回退【待补充】占位。
  # 已于 2026-11-19 默认开启（用户拍板）：机器人/CLI 不带旗标也会接地。仍受 feishu.enabled 门控
  # （不推送的纯本地跑不触网），--scope-grounding 仍可临时覆盖。置回 false 即行为与 V1 逐字一致。
  enabled: true
  # 测试用例表定位与解析：case_doc_title=版本目录下用例文件标题关键词；module_col/name_col=模块列/用名列表头；
  # group_level：top=按一级菜单聚合（默认）/ full=按完整路径。
  # top_modules：2.1 表单列的最大模块数（代码默认 0=不限制）。用例表「模块分类」填成扁平名（无层级）时，
  # 一级聚合会产出几十行；>0 时按用例数降序取前 N 行，其余合并为末行「其他（M 个模块）」，
  # 描述列逐字列出其余模块名（最多 8 个，超出以…收尾）——不改数据源、不臆造分组名。
  # 根治办法仍是用例表把「模块分类」填成「一级-二级」层级路径（参考 V5.1.0，5 个模块即可全列）。
  case_doc_title: "测试用例"
  module_col: "模块分类"
  name_col: "用例名称"
  group_level: "top"
  top_modules: 10
  # exec_stats：用例执行统计（2026-11-20 用户需求）：开启后 2.1 范围表后补一句用例总条数文字（表列不变，用户拍板），
  # 并新增 3.3 测试用例执行概况（按用例表「执行结果」列聚合：执行率=已执行÷总数、通过率=通过÷已执行）。
  # 用表无该列或未记录结果时如实只出用例条数、不输出通过率（不编造）；关时报告与现状逐字一致。
  exec_stats: true
  exec_col: "执行结果"
  # category_col：2.1 范围表三列形态（2026-11-20 用户拍板）：模块=用例表「所属模块」列（逐字读，不从组名拆），
  # 分类=module_groups 组名（开头与所属模块相同的前缀剥掉：云文档-文档类型与管理→文档类型与管理；
  # 前缀不同则整名保留：所属模块=云文档 时「第三方集成-飞书应用」原样上表），描述=现状（成员模块名）。
  # 同模块多分类时模块名只在首行写、续行留空近似合并单元格（Markdown→pandoc→飞书链路不支持真 rowspan，
  # 伪合并已与用户确认；要真合并在飞书里选中模块列点一次「合并单元格」即可）。
  # 用例表无「所属模块」列或任一行未填 → 自动回退两列（不编造 owner）；关时报告与现状逐字一致。
  # 后续若把第三方集成那批用例的所属模块改填「第三方集成」，报告会自动分裂成两个模块块，无需改代码。
  category_col: true
  owner_col: "所属模块"
  # module_groups：人工确认的「一级菜单 → 成员模块」归并映射（2026-11-19 用户拍板，按 V5.2.0 用例表口径）。
  # 程序只做模块名全等归并：成员名逐字来自用例表，未命中任何组的模块原样单列（不丢数据、不发明组名）。
  # 存疑三处按用户确认：飞书授权与安全→「第三方集成-飞书应用」；飞书文档同步/飞书同步任务→「第三方集成-文档同步」。
  # 当前映射覆盖 V5.2.0 用例表全部 33 个「模块分类」（合计 206 条用例）；新出现未覆盖的模块会自动单列一行，
  # 不会归错组。本映射仅适用于同类扁平写法的新版本；已填层级路径的用例表（如 V5.1.0）本就不会命中成员名。
  module_groups:
    - name: "云文档-文档类型与管理"
      modules: ["Excel文档", "Word文档", "PDF文档", "云文档类型扩展", "文档管理设置入口"]
    - name: "云文档-分享与协作"
      modules: ["指定协作者模式", "协作者权限范围", "协作者边界场景", "公开协作模式", "公开链接权限校验",
                "分享设置弹窗", "分享链接管控", "分享并发与权限联动", "分享异常与空态", "分享回归校验", "外部申请协同"]
    - name: "第三方集成-飞书应用"
      modules: ["第三方平台总览", "飞书应用列表展示", "飞书应用创建", "飞书应用编辑", "飞书应用删除", "飞书授权与安全"]
    - name: "第三方集成-文档同步"
      modules: ["飞书文档同步", "飞书同步任务", "文档同步权限", "文档同步Tab交互", "文档同步分类勾选",
                "文档同步资源列表", "文档同步多选组合", "文档同步授权前置校验", "文档同步提交联动",
                "文档同步并发与回归", "文档同步异常与空态"]

test_env:
  # 2.2 测试环境接地：从知识库「项目层」环境文档（如 Uniresearch测试环境及账号）逐字提取地址/账号密码。
  # 只搜索项目节点层（深度 ≤2、跳过版本目录）；行组须「环境名+http地址+非空账号」齐备才采纳，否则整体回退占位。
  # 凭证逐字写入报告经用户拍板（报告与源文档同处知识库权限体系）。
  # 已于 2026-11-19 默认开启（用户拍板）：仍受 feishu.enabled 门控（不推送的纯本地跑不触网），
  # --test-env 仍可临时覆盖。置回 false 即 2.2 与现状逐字一致、零触碰网络。
  enabled: true
  doc_keywords:
    - "测试环境"
    - "账号"

doc_index:
  # §1.3 手册/UI/原型链接接地：从知识库项目层「链接汇总文档」（如 Uniresearch原型、UI设计、用户手册链接）逐字提取外链。
  # 复用 2.2 同一套项目层候选检索（深度 ≤2、跳过版本目录）；因 raw_content 会丢超链接 URL，改读 docx blocks 解析「文档名|链接」相邻行组。
  # 文档名去空白全等、URL 须 http(s) 开头（明文或 link.url 百分号解码）才采纳；未命中行维持记忆/人工占位。
  # 已于 2026-11-19 默认开启（用户拍板）：仍受 feishu.enabled 门控（不推送的纯本地跑不触网），
  # --doc-index 仍可临时覆盖。置回 false 即零触碰网络、§1.3 后三行维持记忆/人工占位。
  enabled: true
  doc_keywords:
    - "原型"
    - "手册"
    - "链接"
